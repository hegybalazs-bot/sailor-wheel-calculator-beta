name: Wheel regression tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all deterministic unit and migration tests
        run: node --test tests/*.test.cjs
      - name: Validate current beta evidence and release blockers
        run: node tools/release-gate.cjs
      - name: Build safe public-only static bundle
        run: node tools/build-public.cjs
      - name: Store independently inspectable public-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-calculator-public-bundle
          path: dist-public/
          if-no-files-found: error
          retention-days: 14
      - name: Generate 90–140 CAP Blue admin verification template
        run: node tools/export-admin-blue-review.cjs
      - name: Upload unverified admin Blue review worksheet
        uses: actions/upload-artifact@v4
        with:
          name: wheel-blue-admin-review-template
          path: artifacts/review/Sailor_Blue_Verification_Template.csv
          if-no-files-found: error
          retention-days: 30
