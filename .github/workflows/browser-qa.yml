name: Browser QA (Chromium)
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser automation
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium, Firefox and WebKit runtimes
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Chromium desktop and mobile viewport tests
        run: node tests/browser-smoke.mjs
      - name: Run Firefox and WebKit public smoke tests
        run: node tests/browser-compat.mjs
      - name: Upload screenshots for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: artifacts/browser
          if-no-files-found: warn
          retention-days: 7
